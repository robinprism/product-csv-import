<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import products</title><link rel="stylesheet" href="/style.css"></head>
<body><main><p>Fictional take-home exercise</p><h1>Import products</h1>
<p>Preview the spreadsheet and fix any errors before adding products.</p>
<label>Choose a CSV <input id="file" type="file" accept=".csv,text/csv"></label>
<label for="csv">Or paste CSV</label><textarea id="csv" rows="7">sku,name,price
MUG-01,Coffee mug,299
mug-01,Travel mug,399
PEN-02,Blue pen,-20</textarea>
<button id="preview">Preview products</button><p id="status" role="status" aria-live="polite"></p>
<table><thead><tr><th>CSV row</th><th>Product code</th><th>Name</th><th>Price</th><th>Issues</th></tr></thead><tbody id="rows"></tbody></table>
<button id="confirm" disabled>Confirm import</button><p id="saved"></p>
</main><script type="module" src="/app.js"></script></body></html>
